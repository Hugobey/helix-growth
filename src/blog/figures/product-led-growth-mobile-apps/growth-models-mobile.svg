<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 860" width="360" height="860" fill="none" role="img" aria-label="Comparison of two growth models. Marketing-led: more budget, more installs, more customers, more revenue. Product-led: more relevant users, more product value, better retention, more referrals, more sustainable revenue, feeding back into the product."><defs><radialGradient id="growth-models-m-c"><stop offset="0" stop-color="#FF4D1C" stop-opacity="0.55"/><stop offset=".45" stop-color="#FF4D1C" stop-opacity="0.17"/><stop offset="1" stop-color="#FF4D1C" stop-opacity="0"/></radialGradient><radialGradient id="growth-models-m-t"><stop offset="0" stop-color="#3E6D88" stop-opacity="0.75"/><stop offset=".45" stop-color="#3E6D88" stop-opacity="0.22"/><stop offset="1" stop-color="#3E6D88" stop-opacity="0"/></radialGradient><radialGradient id="growth-models-m-w"><stop offset="0" stop-color="#FF8C48" stop-opacity="0.35"/><stop offset=".45" stop-color="#FF8C48" stop-opacity="0.10"/><stop offset="1" stop-color="#FF8C48" stop-opacity="0"/></radialGradient><radialGradient id="growth-models-m-halo"><stop offset="0" stop-color="#FF4D1C" stop-opacity="0.55"/><stop offset=".45" stop-color="#FF4D1C" stop-opacity="0.17"/><stop offset="1" stop-color="#FF4D1C" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="360" height="390" rx="20" fill="#FFFFFF" stroke="rgba(22,22,22,0.08)"/><text x="28" y="40" font-family="Satoshi, Manrope, sans-serif" font-size="12" font-weight="700" fill="#3E6D88" text-anchor="start" letter-spacing="0.14em">MARKETING-LED GROWTH</text><text x="28" y="76" font-family="'Cabinet Grotesk', 'Schibsted Grotesk', Satoshi, sans-serif" font-size="25" font-weight="700" fill="#161616" text-anchor="start" letter-spacing="-0.03em">A line you keep feeding</text><rect x="28" y="104" width="304" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="124" r="4.5" fill="#FF4D1C"/><text x="66" y="129.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More budget</text><path d="M180.0 147L180.0 163M176.0 157.2L180.0 163L184.0 157.2" stroke="#5C564F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="166" width="304" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="186" r="4.5" fill="#3E6D88"/><text x="66" y="191.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More installs</text><path d="M180.0 209L180.0 225M176.0 219.2L180.0 225L184.0 219.2" stroke="#5C564F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="228" width="304" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="248" r="4.5" fill="#3E6D88"/><text x="66" y="253.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More customers</text><path d="M180.0 271L180.0 287M176.0 281.2L180.0 287L184.0 281.2" stroke="#5C564F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="290" width="304" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="310" r="4.5" fill="#3E6D88"/><text x="66" y="315.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More revenue</text><text x="28" y="366" font-family="Satoshi, Manrope, sans-serif" font-size="14" font-weight="500" fill="#5C564F" text-anchor="start">The engine sits largely outside the product.</text><rect x="0" y="408" width="360" height="452" rx="20" fill="#162028" stroke="none"/><radialGradient id="growth-models-m-p" gradientUnits="userSpaceOnUse" cx="43.199999999999996" cy="408" r="216.0"><stop offset="0" stop-color="#FF4D1C" stop-opacity=".32"/><stop offset="1" stop-color="#FF4D1C" stop-opacity="0"/></radialGradient><rect x="0" y="408" width="3