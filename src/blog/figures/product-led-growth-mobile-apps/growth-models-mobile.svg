)"/><circle cx="50" cy="718" r="4.5" fill="#FF4D1C"/><text x="66" y="723.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#F6F4F0" text-anchor="start">More referrals</text><path d="M163.0 741L163.0 757M159.0 751.2L163.0 757L167.0 751.2" stroke="#C9C6C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="760" width="270" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/><circle cx="50" cy="780" r="4.5" fill="#FF4D1C"/><text x="66" y="785.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#F6F4F0" text-anchor="start">More sustainable revenue</text><path d="M302 780C338 780 338 760 338 730V582C338 546 328 532 308 532" stroke="#FF4D1C" stroke-width="2" stroke-dasharray="6 5"/><path d="M314 532L303 532M308.8 528.0L303 532L308.8 536.0" stroke="#FF4D1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="836" font-family="Satoshi, Manrope, sans-serif" font-size="14" font-weight="500" fill="#C9C6C2" text-anchor="start">The product is part of distribution.</text></svg>