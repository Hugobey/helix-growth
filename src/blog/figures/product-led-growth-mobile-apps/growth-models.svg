<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" fill="none" role="img" aria-label="Comparison of two growth models. Marketing-led: more budget, more installs, more customers, more revenue. Product-led: more relevant users, more product value, better retention, more referrals, more sustainable revenue, feeding back into the product."><defs><radialGradient id="growth-models-c"><stop offset="0" stop-color="#FF4D1C" stop-opacity="0.55"/><stop offset=".45" stop-color="#FF4D1C" stop-opacity="0.17"/><stop offset="1" stop-color="#FF4D1C" stop-opacity="0"/></radialGradient><radialGradient id="growth-models-t"><stop offset="0" stop-color="#3E6D88" stop-opacity="0.75"/><stop offset=".45" stop-color="#3E6D88" stop-opacity="0.22"/><stop offset="1" stop-color="#3E6D88" stop-opacity="0"/></radialGradient><radialGradient id="growth-models-w"><stop offset="0" stop-color="#FF8C48" stop-opacity="0.35"/><stop offset=".45" stop-color="#FF8C48" stop-opacity="0.10"/><stop offset="1" stop-color="#FF8C48" stop-opacity="0"/></radialGradient><radialGradient id="growth-models-halo"><stop offset="0" stop-color="#FF4D1C" stop-opacity="0.55"/><stop offset=".45" stop-color="#FF4D1C" stop-opacity="0.17"/><stop offset="1" stop-color="#FF4D1C" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="468" height="480" rx="20" fill="#FFFFFF" stroke="rgba(22,22,22,0.08)"/><text x="28" y="40" font-family="Satoshi, Manrope, sans-serif" font-size="12" font-weight="700" fill="#3E6D88" text-anchor="start" letter-spacing="0.14em">MARKETING-LED GROWTH</text><text x="28" y="76" font-family="'Cabinet Grotesk', 'Schibsted Grotesk', Satoshi, sans-serif" font-size="28" font-weight="700" fill="#161616" text-anchor="start" letter-spacing="-0.03em">A line you keep feeding</text><rect x="28" y="104" width="412" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="124" r="4.5" fill="#FF4D1C"/><text x="66" y="129.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More budget</text><path d="M234.0 147L234.0 163M230.0 157.2L234.0 163L238.0 157.2" stroke="#5C564F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="166" width="412" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="186" r="4.5" fill="#3E6D88"/><text x="66" y="191.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More installs</text><path d="M234.0 209L234.0 225M230.0 219.2L234.0 225L238.0 219.2" stroke="#5C564F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="228" width="412" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="248" r="4.5" fill="#3E6D88"/><text x="66" y="253.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More customers</text><path d="M234.0 271L234.0 287M230.0 281.2L234.0 287L238.0 281.2" stroke="#5C564F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="290" width="412" height="40" rx="20" fill="#F6F4F0" stroke="rgba(22,22,22,0.08)"/><circle cx="50" cy="310" r="4.5" fill="#3E6D88"/><text x="66" y="315.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#161616" text-anchor="start">More revenue</text><text x="28" y="456" font-family="Satoshi, Manrope, sans-serif" font-size="14" font-weight="500" fill="#5C564F" text-anchor="start">The engine largely sits outside the product.</text><rect x="492" y="0" width="468" height="480" rx="20" fill="#162028" stroke="none"/><radialGradient id="growth-models-p" gradientUnits="userSpaceOnUse" cx="548.16" cy="0" r="280.8"><stop offset="0" stop-color="#FF4D1C" stop-opacity=".32"/><stop offset="1" stop-color="#FF4D1C" stop-opacity="0"/></radialGradient><rect x="492" y="0" width="468" height="480" rx="20" fill="url(#growth-models-p)" stroke="none"/><text x="520" y="40" font-family="Satoshi, Manrope, sans-serif" font-size="12" font-weight="700" fill="#FF7340" text-anchor="start" letter-spacing="0.14em">PRODUCT-LED GROWTH</text><text x="520" y="76" font-family="'Cabinet Grotesk', 'Schibsted Grotesk', Satoshi, sans-serif" font-size="28" font-weight="700" fill="#F6F4F0" text-anchor="start" letter-spacing="-0.03em">A system that compounds</text><rect x="520" y="104" width="378" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/><circle cx="542" cy="124" r="4.5" fill="#FF4D1C"/><text x="558" y="129.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#F6F4F0" text-anchor="start">More relevant users</text><path d="M709.0 147L709.0 163M705.0 157.2L709.0 163L713.0 157.2" stroke="#C9C6C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="166" width="378" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/><circle cx="542" cy="186" r="4.5" fill="#FF4D1C"/><text x="558" y="191.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#F6F4F0" text-anchor="start">More product value</text><path d="M709.0 209L709.0 225M705.0 219.2L709.0 225L713.0 219.2" stroke="#C9C6C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="228" width="378" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/><circle cx="542" cy="248" r="4.5" fill="#FF4D1C"/><text x="558" y="253.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#F6F4F0" text-anchor="start">Better retention</text><path d="M709.0 271L709.0 287M705.0 281.2L709.0 287L713.0 281.2" stroke="#C9C6C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="290" width="378" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/><circle cx="542" cy="310" r="4.5" fill="#FF4D1C"/><text x="558" y="315.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#F6F4F0" text-anchor="start">More referrals</text><path d="M709.0 333L709.0 349M705.0 343.2L709.0 349L713.0 343.2" stroke="#C9C6C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="352" width="378" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/><circle cx="542" cy="372" r="4.5" fill="#FF4D1C"/><text x="558" y="377.5" font-family="Satoshi, Manrope, sans-serif" font-size="15" font-weight="500" fill="#F6F4F0" text-anchor="start">More sustainable revenue</text><path d="M902 372C938 372 938 352 938 322V174C938 138 928 124 908 124" stroke="#FF4D1C" stroke-width="2" stroke-dasharray="6 5"/><path d="M914 124L903 124M908.8 120.0L903 124L908.8 128.0" stroke="#FF4D1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="456" font-family="Satoshi, Manrope, sans-serif" font-size="14" font-weight="500" fill="#C9C6C2" text-anchor="start">The product is part of distribution.</text></svg>